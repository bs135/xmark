[package]
name = "xmark"
version = "0.3.0"
description = "Fast, cross-platform image watermarking desktop tool"
authors = ["xmark"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "xmark_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
rayon = "1.10"
walkdir = "2.5"
base64 = "0.22"

