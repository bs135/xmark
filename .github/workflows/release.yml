name: Release
# Requires repository setting "Settings > Actions > General > Workflow permissions"
# set to "Read and write permissions" so the tag-release job can push the
# version-bump commit and tag back to `main`.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build (defaults to the branch this workflow is run from)
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-release:
    name: Determine version and create tag
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
      released: ${{ steps.tag_version.outputs.new_tag != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          dry_run: true

      - name: Setup Node.js
        if: steps.tag_version.outputs.new_tag != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version in project files
        if: steps.tag_version.outputs.new_tag != ''
        env:
          NEW_VERSION: ${{ steps.tag_version.outputs.new_version }}
        run: |
          set -euo pipefail
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
          sed -i "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" src-tauri/Cargo.toml
          jq --arg v "$NEW_VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json

      - name: Commit version bump and push tag
        if: steps.tag_version.outputs.new_tag != ''
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
          NEW_VERSION: ${{ steps.tag_version.outputs.new_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json

          if git diff --cached --quiet; then
            echo "Version files already at ${NEW_VERSION}; skipping bump commit."
          else
            git commit -m "chore(release): ${NEW_VERSION} [skip ci]"
            git push origin HEAD:main
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${NEW_TAG}" > /dev/null; then
            echo "Tag ${NEW_TAG} already exists on origin; skipping tag creation."
          else
            git tag -a "$NEW_TAG" -m "$NEW_TAG"
            git push origin "$NEW_TAG"
          fi

  build-and-release:
    name: Build (${{ matrix.platform }})
    needs: tag-release
    if: always() && !cancelled() && ((github.event_name == 'push' && needs.tag-release.result == 'success' && needs.tag-release.outputs.released == 'true') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS ARM64 (M1/M2/M3)
            os: macos-14
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ""
          - platform: Linux x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && needs.tag-release.outputs.new_tag || inputs.branch || github.ref }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.tag-release.outputs.new_tag }}
          releaseName: ${{ needs.tag-release.outputs.new_tag }}
          releaseBody: ${{ needs.tag-release.outputs.changelog }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          assetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"

      - name: Build app bundles
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: xmark-${{ matrix.rust_target }}
          path: |
            src-tauri/target/**/release/bundle/**
          retention-days: 14
          if-no-files-found: error
