name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-release:
    name: Determine version and create tag
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
      released: ${{ steps.tag_version.outputs.new_tag != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

  build-and-release:
    name: Build (${{ matrix.platform }})
    needs: tag-release
    if: needs.tag-release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS ARM64 (M1/M2/M3)
            os: macos-14
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macOS x64 (Intel)
            os: macos-13
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ""
          - platform: Linux x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-release.outputs.new_tag }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.tag-release.outputs.new_tag }}
          releaseName: ${{ needs.tag-release.outputs.new_tag }}
          releaseBody: ${{ needs.tag-release.outputs.changelog }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
