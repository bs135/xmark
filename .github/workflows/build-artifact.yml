name: Build Artifacts (manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build (defaults to the branch this workflow is run from)
        required: false
        type: string

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS ARM64 (M1/M2/M3)
            os: macos-14
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macOS x64 (Intel)
            os: macos-13
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ""
          - platform: Linux x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xmark-${{ matrix.rust_target }}
          path: |
            src-tauri/target/**/release/bundle/**
          retention-days: 14
          if-no-files-found: error
